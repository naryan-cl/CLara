  <style>

      --ember: #c97b4a;

      --paper: #fbf9f5;

      --muted: color-mix(in srgb, var(--ink) 55%, transparent);
      --node: color-mix(in srgb, var(--horizon) 18%, var(--paper));
      --node-stroke: var(--horizon);
      --node-meta: color-mix(in srgb, var(--glow) 35%, var(--paper));
      --node-meta-stroke: var(--forest);
      --shadow: 0 10px 30px rgba(28, 42, 46, 0.08);

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background:

        radial-gradient(ellipse at 90% 8%, rgba(62, 110, 142, 0.12) 0%, transparent 40%),

      color: var(--ink);
      min-height: 100vh;

    body.embed {
      min-height: 0;
      background: var(--sand);
    }
    header {
      padding: 1.25rem 1.5rem 0.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    body.embed header { display: none; }
    header h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 500;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      max-width: 42rem;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .badge {
      display: inline-block;
      margin-top: 0.7rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--forest);
      border: 1px solid var(--cloud);
      background: var(--paper);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.9fr);
      gap: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem 2rem;
    }
    body.embed .layout {
      max-width: none;
      padding: 0.75rem;
      gap: 0.75rem;
      min-height: calc(100vh - 0.5rem);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .canvas-wrap {
      background: var(--paper);
      border: 1px solid var(--cloud);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 520px;
    }
    body.embed .canvas-wrap { min-height: calc(100vh - 1.5rem); }
    svg { width: 100%; height: auto; display: block; }
    .edge {

      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge.dashed {
      stroke-dasharray: 6 6;

    }
    .edge.active {
      stroke: var(--horizon);
      marker-end: url(#arrowActive);
    }
    .node {

    }
    .node rect {
      fill: var(--node);
      stroke: var(--node-stroke);
      stroke-width: 1.5;
      rx: 10;
      transition: fill 0.15s ease, stroke 0.15s ease, filter 0.15s ease;

    .node.meta rect {
      fill: var(--node-meta);
      stroke: var(--node-meta-stroke);
    }

    const edges = [
      { from: "organizational-overwhelm", to: "workslop-economy" },
      { from: "workslop-economy", to: "expertise-paradox" },
      { from: "expertise-paradox", to: "future-of-coaching" },

    // Evidence embedded for offline / embed use (also available as theme-evidence-ui.json)
    let evidence = null;
    async function loadEvidence() {
      if (window.__SYNTHESIS_EVIDENCE__) {
        evidence = window.__SYNTHESIS_EVIDENCE__;
        return;
      }
      try {
        const res = await fetch("./theme-evidence-ui.json", { cache: "no-store" });
        if (res.ok) evidence = await res.json();
      } catch (_) {}
      if (!evidence) evidence = {};
    }

    function nodeById(id) {
      return nodes.find((n) => n.id === id);
    }

    function center(n) {
      return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
    }

    function draw() {
      const svg = document.getElementById("map");
      const edgeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      edgeLayer.setAttribute("id", "edges");
      const nodeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      nodeLayer.setAttribute("id", "nodes");
      svg.appendChild(edgeLayer);
      svg.appendChild(nodeLayer);

      for (const e of edges) {
        const a = nodeById(e.from);
        const b = nodeById(e.to);
        if (!a || !b) continue;
        const ca = center(a);
        const cb = center(b);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const midX = (ca.x + cb.x) / 2;
        const d = `M ${ca.x} ${ca.y} C ${midX} ${ca.y}, ${midX} ${cb.y}, ${cb.x} ${cb.y}`;
        path.setAttribute("d", d);
        path.setAttribute("class", e.dashed ? "edge dashed" : "edge");
        path.dataset.from = e.from;
        path.dataset.to = e.to;
        edgeLayer.appendChild(path);
      }

      for (const n of nodes) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", n.meta ? "node meta" : "node");
        g.dataset.id = n.id;
        g.dataset.theme = n.theme;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", n.x);
        rect.setAttribute("y", n.y);
        rect.setAttribute("width", n.w);
        rect.setAttribute("height", n.h);
        g.appendChild(rect);
        const lines = n.label.split("\n");
        lines.forEach((line, i) => {
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", n.x + n.w / 2);
          text.setAttribute("y", n.y + n.h / 2 + (i - (lines.length - 1) / 2) * 14);
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("dominant-baseline", "middle");
          text.textContent = line;
          g.appendChild(text);
        });
        g.addEventListener("click", () => selectNode(n.id));
        nodeLayer.appendChild(g);
      }
    }

    function selectNode(id) {
      document.querySelectorAll(".node").forEach((el) => {
        el.classList.toggle("active", el.dataset.id === id);
      });
      document.querySelectorAll(".edge").forEach((el) => {
        const on = el.dataset.from === id || el.dataset.to === id;
        el.classList.toggle("active", on);
      });
      const n = nodeById(id);
      const data = evidence?.[n.theme] || evidence?.[id];
      const panel = document.getElementById("detail");
      if (!data) {
        panel.innerHTML = `<div class="eyebrow">Theme</div><h2>${n.label.replace("\n", " ")}</h2><p class="empty">No packaged evidence for this node yet.</p>`;
        return;
      }
      const insights = (data.insights || []).map((t) => `<li>${escapeHtml(t)}</li>`).join("");
      const conflicts = (data.conflicts || []).map((t) => `<li>${escapeHtml(t)}</li>`).join("");
      const quotes = (data.quotes || [])
        .map(
          (q) =>
            `<blockquote>${escapeHtml(q.text)}<span class="session">${escapeHtml(q.session || "")}${q.note ? " · " + escapeHtml(q.note) : ""}</span></blockquote>`,
        )
        .join("");
      const sessions = (data.sessions || []).join(" · ");
      panel.innerHTML = `
        <div class="eyebrow">Theme</div>
        <h2>${escapeHtml(data.title || n.label)}</h2>
        <h3>Insights</h3>
        <ul>${insights || "<li class='empty'>None packaged</li>"}</ul>
        <h3>Conflicting perspectives</h3>
        <ul>${conflicts || "<li class='empty'>None packaged</li>"}</ul>
        <h3>Key quotes</h3>
        ${quotes || "<p class='empty'>None packaged</p>"}
        <h3>Sessions</h3>
        <p class="sessions">${escapeHtml(sessions)}</p>
      `;
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    draw();
    loadEvidence().then(() => {
      // optional: auto-select meta as orientation
    });
  </script>
</body>
</html>
