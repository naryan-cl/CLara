      { id: "e7", from: "ai-expertise", to: "safety-governance", curve: "gentle" },
      { id: "e8", from: "safety-governance", to: "tech-infrastructure", curve: "straight" },
      { id: "e9", from: "ai-expertise", to: "tech-infrastructure", curve: "straight", lane: -1 },
      { id: "e10", from: "tech-infrastructure", to: "ai-expertise", curve: "straight", lane: 1 },
      { id: "e11", from: "tech-infrastructure", to: "support-business-ops", curve: "straight" },
      { id: "e12", from: "tech-infrastructure", to: "client-value-trust", curve: "arc-top-left", label: "We can build tools that support clients", labelW: 150 },
      { id: "e13", from: "support-business-ops", to: "client-value-trust", curve: "arc-top-right", label: "Go-to-market and business development processes", labelW: 168 },
    ];

    nodes.forEach((n, i) => {
      n.x = 0;
      n.y = 0;
      n.dragging = false;
      n.springStartX = 0;
      n.springStartY = 0;
    });

    let evidence = {};
    let selectedId = "client-value-trust";
    let settleTimer = null;
    let springing = false;
    let springStart = 0;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const MAX_DRAG = 85;
    const SETTLE_MS = 5000;
    const SPRING_MS = 850;

    function nodeById(id) {
      return nodes.find((n) => n.id === id);
    }

    function nodeCenter(n) {
      return { x: n.anchorX + n.x + n.w / 2, y: n.anchorY + n.y + n.h / 2 };
    }

    function nodeRadius(n) {
      return { rx: n.w * 0.48, ry: n.h * 0.48 };
    }

    function borderPoint(from, to, lane) {
      const c = nodeCenter(from);
      const tc = nodeCenter(to);
      let dx = tc.x - c.x;
      let dy = tc.y - c.y;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len;
      dy /= len;
      if (lane) {
        c.x += -dy * lane * 5;
        c.y += dx * lane * 5;
      }
      const { rx, ry } = nodeRadius(from);
      const denom = Math.sqrt((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry)) || 1;
      return { x: c.x + dx / denom, y: c.y + dy / denom };
    }

    function buildEdgeGeometry(e) {
      const a = nodeById(e.from);
      const b = nodeById(e.to);
      if (!a || !b) return null;
      const p1 = borderPoint(a, b, e.lane);
      const p2 = borderPoint(b, a, e.lane ? -e.lane : 0);
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      let d, ctrl;
      switch (e.curve) {
        case "arc-left":
          ctrl = { x: p1.x - 70, y: my - 50 };
          d = `M ${p1.x} ${p1.y} Q ${ctrl.x} ${ctrl.y}, ${p2.x} ${p2.y}`;
          break;
        case "arc-far":
          ctrl = { x: mx + 120, y: my + 30 };
          d = `M ${p1.x} ${p1.y} Q ${ctrl.x} ${ctrl.y}, ${p2.x} ${p2.y}`;
          break;
        case "arc-top-left":
          ctrl = { x: mx - 20, y: Math.min(p1.y, p2.y) - 85 };
          d = `M ${p1.x} ${p1.y} Q ${ctrl.x} ${ctrl.y}, ${p2.x} ${p2.y}`;
          break;
        case "arc-top-right":
          ctrl = { x: mx + 80, y: Math.min(p1.y, p2.y) - 95 };
          d = `M ${p1.x} ${p1.y} Q ${ctrl.x} ${ctrl.y}, ${p2.x} ${p2.y}`;
          break;
        case "gentle":
          ctrl = { x: mx + 25, y: my + 22 };
          d = `M ${p1.x} ${p1.y} Q ${ctrl.x} ${ctrl.y}, ${p2.x} ${p2.y}`;
          break;
        default:
          ctrl = { x: mx, y: my };
          d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
      }
      return { d, ctrl, p1, p2 };
    }

    function quadMid(p0, ctrl, p2) {
      const t = 0.5;
      return {
        x: (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * ctrl.x + t * t * p2.x,
        y: (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * ctrl.y + t * t * p2.y,
      };
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function svgScale() {
      const svg = document.getElementById("map");
      return svg.getBoundingClientRect().width / VB_W;
    }

    function buildNodes() {
      const layer = document.getElementById("node-layer");
      layer.innerHTML = "";
      nodes.forEach((n) => {
        const style = NODE_STYLES[n.theme];
        const el = document.createElement("div");
        el.className = "organic-node" + (n.northStar ? " north-star" : "");
        el.id = "node-" + n.id;
        el.dataset.id = n.id;
        const inner = document.createElement("div");
        inner.className = "blob-inner";
        inner.style.background = style.gradient;
        inner.style.borderColor = style.border;
        inner.style.borderRadius = style.radius;
        if (!reduceMotion) {
          inner.style.animationDuration = style.drift;
          inner.style.animationDelay = style.delay;
        }
        const shell = document.createElement("div");
        shell.className = "blob-shell";
        const label = document.createElement("div");
        label.className = "blob-label";
        label.textContent = n.label;
        shell.appendChild(label);
        el.appendChild(inner);
        el.appendChild(shell);
        el.addEventListener("click", () => {
          if (el.dataset.dragged === "1") {
            el.dataset.dragged = "0";
            return;
          }
          selectNode(n.id);
        });
        bindDrag(el, n);
        layer.appendChild(el);
      });
    }

    function bindDrag(el, n) {
      let startX = 0, startY = 0, origX = 0, origY = 0, moved = false;
      el.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        n.dragging = true;
        el.classList.add("dragging");
        el.classList.remove("springing");
        springing = false;
        clearTimeout(settleTimer);
        startX = ev.clientX;
        startY = ev.clientY;
        origX = n.x;
        origY = n.y;
        moved = false;
        el.setPointerCapture(ev.pointerId);
      });
      el.addEventListener("pointermove", (ev) => {
        if (!n.dragging) return;
        const scale = svgScale();
        const dx = (ev.clientX - startX) / scale;
        const dy = (ev.clientY - startY) / scale;
        if (Math.hypot(dx, dy) > 4) moved = true;
        n.x = Math.max(-MAX_DRAG, Math.min(MAX_DRAG, origX + dx));
        n.y = Math.max(-MAX_DRAG, Math.min(MAX_DRAG, origY + dy));
        selectNode(n.id);
      });
      el.addEventListener("pointerup", (ev) => {
        n.dragging = false;
        el.classList.remove("dragging");
        if (moved) el.dataset.dragged = "1";
        try { el.releasePointerCapture(ev.pointerId); } catch (_) {}
        scheduleSettle();
      });
      el.addEventListener("pointercancel", () => {
        n.dragging = false;
        el.classList.remove("dragging");
        scheduleSettle();
      });
    }

    function scheduleSettle() {
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => {
        if (nodes.some((n) => n.dragging)) return;
        springing = true;
        springStart = performance.now();
        nodes.forEach((n) => {
          n.springStartX = n.x;
          n.springStartY = n.y;
          const el = document.getElementById("node-" + n.id);
          if (el) el.classList.add("springing");
        });
      }, SETTLE_MS);
    }

    function selectNode(id) {
      selectedId = id;
      document.querySelectorAll(".organic-node").forEach((el) => {
        el.classList.toggle("active", el.dataset.id === id);
      });
      redrawEdges();
      const n = nodeById(id);
      const data = evidence[n.theme] || evidence[id];
      const panel = document.getElementById("detail");
      if (!data) {
        panel.innerHTML = `<div class="eyebrow">Node</div><h2>${escapeHtml(n.label)}</h2><p class="empty">No evidence packaged yet.</p>`;
        return;
      }
      const narrative = data.narrative ? `<p class="narrative">${escapeHtml(data.narrative)}</p>` : "";
      const quotes = (data.quotes || [])
        .slice(0, 2)
        .map((q) => `<blockquote>${escapeHtml(q.text)}<span class="session">${escapeHtml(q.session || "")}${q.note ? " · " + escapeHtml(q.note) : ""}</span></blockquote>`)
        .join("");
      const insights = (data.insights || []).map((t) => `<li>${escapeHtml(t)}</li>`).join("");
      const conflicts = (data.conflicts || []).map((t) => `<li>${escapeHtml(t)}</li>`).join("");
      const sessions = (data.sessions || []).join(" · ");
      panel.innerHTML = `
        <div class="eyebrow">Node</div>
        <h2>${escapeHtml(data.title || n.label)}</h2>
        ${narrative}
        <h3 style="font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--forest);margin:1rem 0 0.4rem">Key quotes</h3>
        ${quotes || "<p class='empty'>None packaged</p>"}
        <details><summary>Insights</summary><ul>${insights || "<li class='empty'>None</li>"}</ul></details>
        <details><summary>Conflicting perspectives</summary><ul>${conflicts || "<li class='empty'>None</li>"}</ul></details>
        <details><summary>Sessions</summary><p class="empty" style="margin-top:0.4rem">${escapeHtml(sessions)}</p></details>
      `;
    }

    function positionNodes() {
      const scale = svgScale();
      const wrap = document.getElementById("canvas-wrap");
      const wrapRect = wrap.getBoundingClientRect();
      const svg = document.getElementById("map");
      const svgRect = svg.getBoundingClientRect();
      const offsetX = svgRect.left - wrapRect.left;
      const offsetY = svgRect.top - wrapRect.top;

      if (springing) {
        const elapsed = performance.now() - springStart;
        const p = Math.min(1, elapsed / SPRING_MS);
        const ease = 1 - Math.pow(1 - p, 3);
        nodes.forEach((n) => {
          if (!n.dragging) {
            n.x = n.springStartX + (0 - n.springStartX) * ease;
            n.y = n.springStartY + (0 - n.springStartY) * ease;
          }
        });
        if (p >= 1) {
          springing = false;
          nodes.forEach((n) => {
            n.x = 0;
            n.y = 0;
            const el = document.getElementById("node-" + n.id);
            if (el) el.classList.remove("springing");
          });
        }
      }

      nodes.forEach((n) => {
        const el = document.getElementById("node-" + n.id);
        if (!el) return;
        const cx = n.anchorX + n.x + n.w / 2;
        const cy = n.anchorY + n.y + n.h / 2;
        const px = offsetX + cx * scale;
        const py = offsetY + cy * scale;
        el.style.width = n.w * scale + "px";
        el.style.height = n.h * scale + "px";
        el.style.left = px + "px";
        el.style.top = py + "px";
        el.style.transform = "translate(-50%, -50%)";
        const label = el.querySelector(".blob-label");
        if (label) {
          const base = n.northStar ? 14 : 13;
          label.style.fontSize = Math.max(10, base * scale) + "px";
        }
      });
    }

    function redrawEdges() {
      const edgeLayer = document.getElementById("edges");
      const labelLayer = document.getElementById("edge-labels");
      edgeLayer.innerHTML = "";
      labelLayer.innerHTML = "";
      const svgNS = "http://www.w3.org/2000/svg";
      const xhtmlNS = "http://www.w3.org/1999/xhtml";

      edges.forEach((e) => {
        const geom = buildEdgeGeometry(e);
        if (!geom) return;
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("d", geom.d);
        path.setAttribute("class", "edge" + (selectedId === e.from || selectedId === e.to ? " active" : ""));
        path.dataset.from = e.from;
        path.dataset.to = e.to;
        edgeLayer.appendChild(path);

        if (e.label) {
          const mid = e.curve === "straight"
            ? { x: (geom.p1.x + geom.p2.x) / 2, y: (geom.p1.y + geom.p2.y) / 2 }
            : quadMid(geom.p1, geom.ctrl, geom.p2);
          const w = e.labelW || 160;
          const h = 44;
          const fo = document.createElementNS(svgNS, "foreignObject");
          fo.setAttribute("class", "edge-pill-wrap");
          fo.setAttribute("x", mid.x - w / 2);
          fo.setAttribute("y", mid.y - h / 2);
          fo.setAttribute("width", w);
          fo.setAttribute("height", h);
          const dim = selectedId && selectedId !== e.from && selectedId !== e.to ? " dim" : "";
          fo.innerHTML = `<div xmlns="${xhtmlNS}" class="edge-pill${dim}">${escapeHtml(e.label)}</div>`;
          labelLayer.appendChild(fo);
        }
      });
    }

    function tick() {
      positionNodes();
      requestAnimationFrame(tick);
    }

    async function loadEvidence() {
      if (window.__SYNTHESIS_EVIDENCE__) {
        evidence = window.__SYNTHESIS_EVIDENCE__;
        return;
      }
      try {
        const res = await fetch("./theme-evidence-ui.json", { cache: "no-store" });
        if (res.ok) evidence = await res.json();
      } catch (_) {}
    }

    buildNodes();
    redrawEdges();
    loadEvidence().then(() => selectNode("client-value-trust"));
    tick();
    window.addEventListener("resize", () => { redrawEdges(); });
  </script>
</body>
</html>
